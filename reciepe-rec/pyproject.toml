[project]
name = "reciepe-rec"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "catboost==1.2.8",
  "numpy==1.26.4",
  "openpyxl>=3.1",
  "pandas==2.2.2",
  "scikit-learn==1.5.1",
]

[project.scripts]
reciepe-rec = "reciepe_rec.cli:main"
reciepe-rec-web = "reciepe_rec.webapp:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
