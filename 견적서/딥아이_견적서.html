<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딥아이 견적서</title>
<style>
  :root{
    --paper:#fff;
    --ink:#111;
    --line:#202020;
    --head:#d9dada;
    --section:#d8d9d9;
    --subhead:#f2f3f3;
    --accent:#c9def5;
    --workspace:#e9eaec;
    --red:#ef2b2d;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--workspace);
    color:var(--ink);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums}

  .toolbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px;background:#262626;color:#fff;border-bottom:1px solid #000;
  }
  .toolbar .title{font-weight:800;margin-right:6px}
  .btn{
    border:1px solid #5b5b5b;border-radius:5px;background:#383838;color:#f5f5f5;
    padding:7px 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn:hover{background:#4a4a4a;border-color:#aaa}
  .btn.primary{background:#c9def5;color:#111;border-color:#c9def5}
  .btn:focus-visible,.ed:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .save{margin-left:auto;font-size:12px;color:#a8a8a8}
  .save.on{color:#9ae6a8}
  .hint{padding:8px 16px;background:#f4f4f4;border-bottom:1px solid #d6d6d6;color:#666;font-size:12px}

  .paper{
    width:794px;min-height:1123px;margin:22px auto 60px;padding:24px 42px 56px;
    background:var(--paper);box-shadow:0 10px 36px rgba(0,0,0,.16);overflow:hidden;
  }
  .quote-frame{border:2px solid var(--line)}
  .company-head{
    height:66px;padding:7px 12px;display:flex;align-items:center;background:var(--head);
    border-bottom:2px solid var(--line);
  }
  .company-head img{display:block;width:176px;height:auto}

  .info-area{position:relative;display:grid;grid-template-columns:1fr 1.12fr;gap:54px;padding:10px 12px 12px}
  .info-col{min-width:0}
  .info-row{
    min-height:29px;display:grid;grid-template-columns:76px 1fr;align-items:center;
    border-bottom:1.5px solid var(--line);font-size:13px;
  }
  .info-row .label{text-align:center;font-weight:600;white-space:nowrap}
  .info-row .value{padding:3px 5px;font-weight:500;line-height:1.28;min-width:0}
  .thanks{margin:25px 0 4px;text-align:center;font-size:14px;font-weight:800}
  .web-value{color:#4f859a;text-decoration:underline;text-underline-offset:2px}

  .quote-amount{
    min-height:29px;display:grid;grid-template-columns:105px 1fr;align-items:center;
    background:var(--accent);border-top:2px solid var(--line);border-bottom:2px solid var(--line);
    font-size:13px;
  }
  .quote-amount .label{text-align:center;font-weight:600}
  .quote-amount .value{text-align:center;font-weight:600;padding:4px 8px}

  .table-wrap{width:100%;overflow:visible}
  table{border-collapse:collapse;width:100%;table-layout:fixed}
  .items{font-size:11px}
  .items col.c-name{width:51%}
  .items col.c-days{width:7.5%}
  .items col.c-rate{width:7.5%}
  .items col.c-people{width:9.5%}
  .items col.c-unit{width:12%}
  .items col.c-amount{width:12.5%}
  .items td,.items th{border-right:1.5px solid var(--line)}
  .items td:last-child,.items th:last-child{border-right:0}
  .section-row td{
    height:24px;padding:3px 13px;background:var(--section);border-top:2px solid var(--line);
    border-bottom:1.5px solid var(--line);font-size:12px;font-weight:600;position:relative;
  }
  .column-row th{
    height:22px;padding:2px 4px;background:var(--subhead);border-bottom:1.5px solid var(--line);
    text-align:center;font-size:11px;font-weight:600;
  }
  .sub-row td,.item-row td{
    height:19px;padding:2px 7px;border-right:1.5px dashed #333;vertical-align:middle;
  }
  .sub-row td{height:22px;border-bottom:1.5px solid var(--line)}
  .sub-row .name{font-weight:600}
  .item-row:last-child td{border-bottom:0}
  .item-name{display:block;padding-left:13px;line-height:1.2}
  td.center{text-align:center}
  td.right{text-align:right}
  .dash{color:#444}
  .amount{padding-right:8px!important}

  .totals{font-size:13px;border-top:1.5px solid var(--line)}
  .totals col:first-child{width:87%}
  .totals col:last-child{width:13%}
  .totals td{height:25px;border-bottom:1.5px solid var(--line)}
  .totals .total-label{text-align:center;font-weight:500}
  .totals .total-value{text-align:right;padding:3px 7px;border-left:1.5px solid var(--line)}
  .totals .cut-value{color:var(--red)}
  .totals .final-row td{background:var(--accent);font-weight:600}

  .notes-title{
    height:27px;display:flex;align-items:center;justify-content:center;background:#ececec;
    border-bottom:1.5px solid var(--line);font-size:17px;font-weight:800;letter-spacing:.42em;padding-left:.42em;
  }
  .notes{min-height:102px;padding:3px 0 5px}
  .note{min-height:23px;padding:4px 0;font-size:11.5px;line-height:1.3;position:relative}

  .ed{outline:0;border-radius:2px;padding:0 2px;cursor:text}
  .ed:hover{background:rgba(55,120,180,.08)}
  .ed:focus{background:rgba(55,120,180,.13);box-shadow:inset 0 0 0 1px rgba(30,100,160,.42)}
  .ed:empty::before{content:attr(data-ph);color:#aaa}
  .cell-num{display:block;min-height:1em;text-align:inherit}

  .ctrls{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0;z-index:4}
  tr:hover .ctrls,.note:hover .ctrls{opacity:1}
  .ic{
    height:20px;min-width:20px;padding:0 4px;border:1px solid #999;border-radius:3px;
    background:#fff;color:#222;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;
  }
  .ic:hover{background:#eee}.ic.del:hover{color:#c00;border-color:#c00}
  .add-section,.add-note{padding:7px 0}
  .add-section button,.add-note button{
    width:100%;border:1px dashed #aaa;background:#fafafa;padding:7px;color:#555;
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
  }

  html.print-prep .no-print{display:none!important}

  @media(max-width:840px){
    .paper{width:100%;margin:0;padding:16px;box-shadow:none}
    .toolbar{position:static}.info-area{grid-template-columns:1fr;gap:14px}
    .thanks{margin:14px 0 2px}.table-wrap{overflow-x:auto}.items,.totals{min-width:700px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  @media print{
    @page{size:A4;margin:0}
    html,body,.paper,.paper *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    body{background:#fff}
    .toolbar,.hint,.no-print{display:none!important}
    .paper{width:auto;min-height:0;margin:0;padding:24px 42px 56px;box-shadow:none;overflow:visible}
    .info-area{grid-template-columns:1fr 1.12fr;gap:54px}
    .thanks{margin:25px 0 4px}
    .items,.totals{min-width:0}
    .ed:hover,.ed:focus{background:none!important;box-shadow:none!important}
    .ctrls{display:none!important}
    .section-row,.column-row,.sub-row,.totals tr,.note{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="toolbar no-print">
  <span class="title">딥아이 견적서</span>

  <button class="btn" id="btn-import">가져오기</button>

  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return null;
    const value=JSON.parse(raw);
    (value.sections||[]).forEach(section=>{section.id=uid();(section.rows||[]).forEach(row=>row.id=uid());});
    return value;
  }catch(_){return null;}
}

let state=load()||seed();
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem(LS_KEY,JSON.stringify(state));
    const status=document.getElementById("save");
    status.classList.add("on");status.textContent="저장됨 ✓";
    setTimeout(()=>status.classList.remove("on"),900);
  },250);
}

const num=value=>{const n=Number(value);return Number.isFinite(n)?n:0;};
const parseNum=value=>{const n=parseInt(String(value).replace(/[^0-9-]/g,""),10);return Number.isNaN(n)?0:n;};
const fmt=value=>Number(value||0).toLocaleString("ko-KR");
const esc=value=>String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function getPath(path){return path.split(".").reduce((object,key)=>object==null?undefined:object[key],state);}
function setPath(path,value){const keys=path.split(".");let object=state;for(let i=0;i<keys.length-1;i++)object=object[keys[i]];object[keys.at(-1)]=value;}

function koreanAmount(value){
  let n=Math.floor(Math.abs(value||0));
  if(n===0)return "영원";
  const digit=["","일","이","삼","사","오","육","칠","팔","구"];
  const small=["","십","백","천"],large=["","만","억","조","경"];
  const groups=[];while(n>0){groups.push(n%10000);n=Math.floor(n/10000);}
  let result="";
  for(let g=groups.length-1;g>=0;g--){
    if(!groups[g])continue;
    const chars=String(groups[g]).padStart(4,"0");let part="";
    for(let i=0;i<4;i++){
      const d=+chars[i];if(!d)continue;
      const unit=3-i;part+=(d===1&&unit>0?"":digit[d])+small[unit];
    }
    result+=part+large[g];
  }
  return result+"원";
}

function amountOf(row){
  if(row.kind!=="item")return 0;
  if(row.amt!=null&&row.amt!=="")return num(row.amt);
  return Math.max(0,Math.round(num(row.days)*(num(row.rate)/100)*num(row.people)*num(row.unit)));
}

function totals(){
  let supply=0;
  state.sections.forEach(section=>section.rows.forEach(row=>supply+=amountOf(row)));
  const admin=Math.round(supply*num(state.rates.admin)/100);
  const profit=Math.round((supply+admin)*num(state.rates.profit)/100);
  const vat=Math.round((supply+admin+profit)*num(state.rates.vat)/100);
  const subtotal=supply+admin+profit+vat;
  const final=state.final==null?Math.floor(subtotal/10000)*10000:num(state.final);
  const cut=subtotal-final;
  return {supply,admin,profit,vat,subtotal,cut,final};
}

const paper=document.getElementById("paper");
function render(){
  document.querySelectorAll("[data-path]").forEach(element=>{
    const path=element.dataset.path;
    if(path==="final"||path==="cut"||document.activeElement===element)return;
    const value=getPath(path);element.textContent=value==null?"":String(value);
  });
  renderRows();renderNotes();refresh();
  paper.querySelectorAll(".ed").forEach(element=>element.setAttribute("contenteditable","true"));
}

function controls(sectionId,rowId){
  return '<span class="ctrls no-print">'+
    '<button class="ic" data-act="row-up" data-sid="'+sectionId+'" data-rid="'+rowId+'">▲</button>'+
    '<button class="ic" data-act="row-down" data-sid="'+sectionId+'" data-rid="'+rowId+'">▼</button>'+
    '<button class="ic del" data-act="del-row" data-sid="'+sectionId+'" data-rid="'+rowId+'">삭제</button></span>';
}

function numericCell(sectionId,rowId,field,value,className=""){
  const empty=field==="rate"?"":"-";
  return '<td class="center '+className+'"><span class="ed cell-num num" data-num="1" data-sid="'+sectionId+'" data-rid="'+rowId+'" data-f="'+field+'">'+(value?fmt(value):empty)+'</span></td>';
}

function renderRows(){
  const body=document.getElementById("rows");body.innerHTML="";
  state.sections.forEach((section,index)=>{
    const sectionRow=document.createElement("tr");sectionRow.className="section-row";
    sectionRow.innerHTML='<td colspan="6">'+(index+1)+'. <span class="ed" data-sid="'+section.id+'" data-f="title">'+esc(section.title)+'</span>'+
      '<span class="ctrls no-print"><button class="ic" data-act="add-item" data-sid="'+section.id+'">+행</button><button class="ic" data-act="add-sub" data-sid="'+section.id+'">+소제목</button><button class="ic" data-act="sec-up" data-sid="'+section.id+'">▲</button><button class="ic" data-act="sec-down" data-sid="'+section.id+'">▼</button><button class="ic del" data-act="del-section" data-sid="'+section.id+'">삭제</button></span></td>';
    body.appendChild(sectionRow);

    const columns=document.createElement("tr");columns.className="column-row";
    columns.innerHTML='<th>내용</th><th>일수</th><th>'+(index===3?"":"참여율")+'</th><th>인력 (개수)</th><th>단가</th><th>금액</th>';
    body.appendChild(columns);

    section.rows.forEach(row=>{
      const tr=document.createElement("tr");tr.dataset.sid=section.id;tr.dataset.rid=row.id;
      if(row.kind==="sub"){
        tr.className="sub-row";
        tr.innerHTML='<td class="name"><span class="ed" data-sid="'+section.id+'" data-rid="'+row.id+'" data-f="text">'+esc(row.text)+'</span>'+controls(section.id,row.id)+'</td>'+
          '<td class="center dash">-</td><td></td><td class="center dash">-</td><td class="center dash">-</td><td class="center dash">-</td>';
      }else{
        tr.className="item-row";
        tr.innerHTML='<td><span class="item-name ed" data-sid="'+section.id+'" data-rid="'+row.id+'" data-f="name" data-ph="내용">'+esc(row.name)+'</span>'+controls(section.id,row.id)+'</td>'+
          numericCell(section.id,row.id,"days",row.days)+numericCell(section.id,row.id,"rate",row.rate,"pct")+
          numericCell(section.id,row.id,"people",row.people)+numericCell(section.id,row.id,"unit",row.unit)+
          '<td class="right amount"><span class="ed cell-num num" data-num="1" data-sid="'+section.id+'" data-rid="'+row.id+'" data-f="amt" data-out="amt-'+row.id+'"></span></td>';
      }
      body.appendChild(tr);
    });
  });
}

function renderNotes(){
  const notes=document.getElementById("notes");notes.innerHTML="";
  state.notes.forEach((text,index)=>{
    const note=document.createElement("div");note.className="note";
    note.innerHTML='<span class="ed" data-path="notes.'+index+'" data-ph="특이사항">'+esc(text)+'</span>'+
      '<span class="ctrls no-print"><button class="ic del" data-act="del-note" data-idx="'+index+'">삭제</button></span>';
    notes.appendChild(note);
  });
}

function setOut(key,value){const element=document.querySelector('[data-out="'+key+'"]');if(element)element.textContent=value;}
function refresh(){
  const result=totals();
  state.sections.forEach(section=>section.rows.forEach(row=>{
    if(row.kind!=="item")return;
    const element=document.querySelector('[data-out="amt-'+row.id+'"]');
    if(element&&document.activeElement!==element){const amount=amountOf(row);element.textContent=amount?fmt(amount):"-";}
  }));
  setOut("quote-amount","일금 "+koreanAmount(result.final).replace(/원$/,"")+"원 정(₩"+fmt(result.final)+") VAT 포함가");
  setOut("supply",fmt(result.supply));setOut("admin",fmt(result.admin));setOut("profit",fmt(result.profit));setOut("vat",fmt(result.vat));
  const cut=document.querySelector('[data-out="cut"]');if(cut&&document.activeElement!==cut)cut.textContent=fmt(result.cut);
  const final=document.querySelector('[data-out="final"]');if(final&&document.activeElement!==final)final.textContent=fmt(result.final);
}

paper.addEventListener("input",event=>{
  const element=event.target.closest(".ed");if(!element)return;
  if(element.dataset.path!=null){
    const path=element.dataset.path;
    if(path==="final"){const text=element.textContent.trim();state.final=text===""?null:parseNum(text);refresh();save();return;}
    if(path==="cut"){const text=element.textContent.trim();state.final=text===""?null:totals().subtotal-parseNum(text);refresh();save();return;}
    if(path.startsWith("rates.")){setPath(path,parseNum(element.textContent));refresh();save();return;}
    if(path.startsWith("notes.")){state.notes[+path.split(".")[1]]=element.textContent;save();return;}
    setPath(path,element.textContent);save();return;
  }
  const section=state.sections.find(item=>item.id===element.dataset.sid);if(!section)return;
  if(element.dataset.rid==null){if(element.dataset.f==="title"){section.title=element.textContent;save();}return;}
  const row=section.rows.find(item=>item.id===element.dataset.rid);if(!row)return;
  if(element.dataset.num){
    if(element.dataset.f==="amt"){const text=element.textContent.trim();row.amt=text===""||text==="-"?null:parseNum(text);}
    else row[element.dataset.f]=parseNum(element.textContent);
    refresh();
  }else row[element.dataset.f]=element.textContent;
  save();
});

paper.addEventListener("focusin",event=>{
  const element=event.target.closest(".ed");if(!element||!element.dataset.num)return;
  const raw=parseNum(element.textContent);element.textContent=raw?String(raw):"";
});
paper.addEventListener("focusout",event=>{
  const element=event.target.closest(".ed");if(!element)return;
  if(element.dataset.num){const value=parseNum(element.textContent);element.textContent=value?fmt(value):"-";}
  refresh();
});

paper.addEventListener("click",event=>{
  const button=event.target.closest("[data-act]");if(!button)return;
  const action=button.dataset.act,sectionId=button.dataset.sid,rowId=button.dataset.rid;
  const sectionIndex=sectionId?state.sections.findIndex(section=>section.id===sectionId):-1;
  const section=sectionIndex>=0?state.sections[sectionIndex]:null;
  if(action==="add-section")state.sections.push({id:uid(),title:"새 구분",rows:[{id:uid(),kind:"item",name:"",days:0,rate:0,people:0,unit:0}]});
  else if(action==="del-section"){if(!confirm("이 구분 전체를 삭제할까요?"))return;state.sections.splice(sectionIndex,1);}
  else if(action==="sec-up"&&sectionIndex>0){const [item]=state.sections.splice(sectionIndex,1);state.sections.splice(sectionIndex-1,0,item);}
  else if(action==="sec-down"&&sectionIndex<state.sections.length-1){const [item]=state.sections.splice(sectionIndex,1);state.sections.splice(sectionIndex+1,0,item);}
  else if(action==="add-item")section.rows.push({id:uid(),kind:"item",name:"",days:0,rate:0,people:0,unit:0});
  else if(action==="add-sub")section.rows.push({id:uid(),kind:"sub",text:"소제목"});
  else if(action==="del-row")section.rows.splice(section.rows.findIndex(row=>row.id===rowId),1);
  else if(action==="row-up"){const index=section.rows.findIndex(row=>row.id===rowId);if(index>0){const [row]=section.rows.splice(index,1);section.rows.splice(index-1,0,row);}}
  else if(action==="row-down"){const index=section.rows.findIndex(row=>row.id===rowId);if(index<section.rows.length-1){const [row]=section.rows.splice(index,1);section.rows.splice(index+1,0,row);}}
  else if(action==="add-note")state.notes.push("");
  else if(action==="del-note")state.notes.splice(+button.dataset.idx,1);
  else return;
  render();save();
});

document.getElementById("btn-print").onclick=()=>window.print();
document.getElementById("btn-reset").onclick=()=>{
  if(confirm("모든 내용을 초기화할까요?")){state=seed();render();save();}
};
document.getElementById("btn-export").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const anchor=document.createElement("a");anchor.href=URL.createObjectURL(blob);anchor.download=(state.meta.docName||"딥아이_견적서")+".json";anchor.click();URL.revokeObjectURL(anchor.href);
};
document.getElementById("btn-import").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=event=>{
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const value=JSON.parse(reader.result);
      (value.sections||[]).forEach(section=>{section.id=uid();(section.rows||[]).forEach(row=>row.id=uid());});
      state=value;render();save();
    }catch(_){alert("불러오기 실패: 올바른 JSON 파일이 아닙니다.");}
  };
  reader.readAsText(file);event.target.value="";
};

function fitPrint(){
  const root=document.documentElement;
  root.classList.add("print-prep");
  paper.style.zoom="";void paper.offsetHeight;
  const pageHeight=297/25.4*96;
  const target=pageHeight*1.1-8;
  const natural=paper.getBoundingClientRect().height;
  if(natural>target&&target/natural>=0.6){
    let low=0.6,high=1;
    for(let i=0;i<10;i++){
      const mid=(low+high)/2;
      paper.style.zoom=String(mid);
      if(paper.getBoundingClientRect().height<=target)low=mid;else high=mid;
    }
    const scale=Math.max(0.6,low-0.008);
    paper.style.zoom=String(scale);
  }
}
function unfitPrint(){paper.style.zoom="";document.documentElement.classList.remove("print-prep");}
window.addEventListener("beforeprint",fitPrint);
window.addEventListener("afterprint",unfitPrint);

render();
</script>
</body>
